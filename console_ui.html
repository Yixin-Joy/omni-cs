/* ----- 設定面板：防「定時重繪把正在打的字清掉」 -----
   症狀：在「試跑」輸入框打字打到一半，內容突然被清空（實測每 30 秒一次）。
   根因：setInterval(loadAutoSettings, 30000) → renderSettingsTab() → body.innerHTML
        整塊重繪，輸入框、下拉選單、分析結果全部回到初始值。
   解法（兩層）：
     1. 內容沒變就完全不動 DOM（沿用 _convHtml / _postDetailHtml 的快取手法）。
     2. 真的要重繪時，先把「使用者改過 / 正在打字」的欄位值與焦點記下來，重繪後搬回去。 */

// 這兩個區塊的內容是使用者操作後才產生的（不在產生的 html 裡），重繪時要一起搬回來
const SP_LIVE_NODES = ['arTestResult', 'dsResult'];

function spFieldKey(el, i) {
  if (el.id) return '#' + el.id;
  // FAQ 表格的 textarea 沒有 id，用「列 id + 欄序」當 key，列增刪也不會錯位
  const tr = el.closest ? el.closest('tr[data-id]') : null;
  if (tr) {
    const fields = Array.prototype.slice.call(tr.querySelectorAll('input,textarea,select'));
    return 'tr' + tr.dataset.id + ':' + fields.indexOf(el);
  }
  return el.tagName + ':' + i;
}

function spSnapshot(root) {
  const active = document.activeElement;
  const out = [];
  Array.prototype.forEach.call(root.querySelectorAll('input,textarea,select'), function (el, i) {
    const checkable = el.type === 'checkbox' || el.type === 'radio';
    const dirty = checkable ? (el.checked !== el.defaultChecked) : (el.value !== el.defaultValue);
    const focused = el === active;
    // 沒改過又沒在打字的欄位不記：讓新 html 顯示伺服器最新值
    if (!dirty && !focused) return;
    out.push({
      key: spFieldKey(el, i), tag: el.tagName, checkable: checkable,
      value: checkable ? null : el.value, checked: el.checked,
      focused: focused, start: el.selectionStart, end: el.selectionEnd,
    });
  });
  const live = {};
  SP_LIVE_NODES.forEach(function (id) {
    const n = document.getElementById(id);
    if (n && n.innerHTML) live[id] = n.innerHTML;
  });
  return { fields: out, live: live };
}

function spRestore(root, snap) {
  if (!snap) return;
  const byKey = {};
  Array.prototype.forEach.call(root.querySelectorAll('input,textarea,select'), function (el, i) {
    byKey[spFieldKey(el, i)] = el;
  });
  snap.fields.forEach(function (s) {
    const el = byKey[s.key];
    if (!el || el.tagName !== s.tag) return;
    if (s.checkable) el.checked = s.checked;
    else el.value = s.value;
    if (s.focused) {
      el.focus();
      try { el.setSelectionRange(s.start, s.end); } catch (e) { /* 某些型別不支援選取範圍 */ }
    }
  });
  Object.keys(snap.live).forEach(function (id) {
    const n = document.getElementById(id);
    if (n) n.innerHTML = snap.live[id];
  });
}

// 唯一寫入 #spBody 的入口
function renderSettingsBody(html) {
  const body = document.getElementById('spBody');
  if (!body) return false;
  if (html === _spHtml && _spTab === arState.tab) return false;   // 沒變就不動 DOM
  const snap = spSnapshot(body);
  body.innerHTML = html;
  _spHtml = html;
  _spTab = arState.tab;
  spRestore(body, snap);
  return true;
}

function renderSettingsTab() {
  if (!arState.settings) {
    renderSettingsBody('<div class="card"><h3>讀不到自動回復設定</h3>' +
      '<div class="hint">後端沒有回應 /console/autoreply/settings。' +
      '請確認：① 服務已用最新程式碼重啟（改完後端要重啟）② 這個 API 回傳 200 JSON。' +
      '服務啟動時 console 應出現「自動回復資料表就緒（platform_forwarder）」。' +
      '若方便，請把瀏覽器開發者工具 Console 分頁的紅色錯誤貼給我。</div>' +
      '<div class="row"><button class="btn primary" onclick="loadAutoSettings()">重新讀取</button></div></div>');
    refreshDeepseekPill();
    return;
  }
  let html, after = null;
  if (arState.tab === 'autoreply') {
    html = autoreplyTabHtml();
    after = loadStats;
  } else if (arState.tab === 'faq') {
    html = faqTabHtml();
    after = function () { if (!arState.faqs.length) loadFaqs(); };
  } else if (arState.tab === 'table') {
    html = tableTabHtml();
    after = function () { if (!arState.tables.length) loadTables(true); };
  } else {
    html = logsTabHtml();
    after = function () { if (!arState.logs.length) loadLogs(); };
  }

  if (renderSettingsBody(html)) {
    if (after) after();
  } else if (arState.tab === 'autoreply') {
    loadStats();   // 沒重繪時只更新唯讀的成效統計，絕不碰輸入框
  }
  refreshDeepseekPill();
}

function refreshDeepseekPill() {
  const el = document.getElementById('spDeepseek');
  const s = arState.settings;
  if (!el || !s) return;
  const ok = s.deepseek.configured;
  el.className = 'pill ' + (ok ? 'on' : 'off');
  el.textContent = ok ? 'DeepSeek 已設定' : 'DeepSeek 未設定';
  el.title = s.deepseek.model + ' · ' + s.deepseek.base_url;
}

async function clearScopeOverride(channel, scope) {
  const res = await apiJson('/console/autoreply/settings/scope', { channel, scope, enabled: null });
  if (res.data.error) { alert('設定失敗：' + res.data.error); return; }
  await loadAutoSettings();
}

async function setLayer(layer, enabled) {
  const res = await apiJson('/console/autoreply/settings/layer', { layer, enabled });
  if (res.data.error) { alert('設定失敗：' + res.data.error); return; }
  await loadAutoSettings();
}

async function testDeepseek() {
  const box = document.getElementById('dsResult');
  if (box) box.innerHTML = '<div class="test-result">測試中…</div>';
  try {
    const d = await api('/console/autoreply/deepseek/test');
    if (box) box.innerHTML = '<div class="test-result">' + (d.ok ? '✅ ' : '❌ ') + esc(d.message) + '</div>';
  } catch (e) {
    if (box) box.innerHTML = '<div class="test-result">❌ ' + esc(e.message) + '</div>';
  }
}

async function testEngine() {
  const box = document.getElementById('arTestResult');
  const text = (document.getElementById('arTestText').value || '').trim();
  const sel = (document.getElementById('arTestTarget').value || '|').split('|');
  if (!text) { alert('請先輸入測試訊息'); return; }
  box.innerHTML = '<div class="test-result">分析中…（第二層會呼叫 DeepSeek，約需數秒）</div>';
  try {

      { text: text, channel: sel[0], scope: sel[1] });

    if (d.error) { box.innerHTML = '<div class="test-result">❌ ' + esc(d.error) + '</div>'; return; }
    box.innerHTML = '<div class="test-result">' +
      '<b>' + esc(d.label) + '</b>（tier=' + esc(d.tier) + '）\n' +
      '是否會發送：' + (d.would_send ? '是' : '否（降級人工回復）') + '\n' +
      (d.detail ? '說明：' + esc(d.detail) + '\n' : '') +
      (d.matched_question ? '命中問法：' + esc(d.matched_question) + '\n' : '') +
      (d.score != null ? '分數：' + d.score + '\n' : '') +
      (d.rewritten_query ? '改寫後問句：' + esc(d.rewritten_query) +
        (d.history_used ? '（帶入 ' + d.history_used + ' 則對話）' : '') + '\n' : '') +
      ((d.history && d.history.length)

function faqRowHtml(f) {
  return '<tr data-id="' + f.id + '" class="' + (f.enabled ? '' : 'off') + '">' +
    '<td style="text-align:center"><input type="checkbox" ' + (f.enabled ? 'checked' : '') +
      ' onchange="markFaqDirty(this)"></td>' +
    '<td><textarea rows="2" oninput="markFaqDirty(this)">' + esc(f.question) + '</textarea></td>' +
    '<td><textarea rows="2" oninput="markFaqDirty(this)">' + esc(f.answer) + '</textarea></td>' +
    '<td><textarea rows="2" oninput="markFaqDirty(this)">' + esc(f.keywords || '') + '</textarea></td>' +
    '<td style="text-align:center">' + (f.hit_count || 0) + '</td>' +
    '<td style="text-align:center"><button class="btn sm danger" onclick="deleteFaq(' + f.id + ')">刪除</button></td>' +
  '</tr>';
}

function markFaqDirty() { /* 目前改動即時收集，這裡只作為 oninput 掛勾 */ }

function collectFaqs() {
  const out = [];
  document.querySelectorAll('#faqBody tr').forEach(tr => {
    const id = Number(tr.dataset.id);
    if (!id) return;
    const tas = tr.querySelectorAll('textarea');
    out.push({
      id: id,
      enabled: tr.querySelector('input[type="checkbox"]').checked,
      question: tas[0].value.trim(),
      answer: tas[1].value.trim(),
      keywords: tas[2].value.trim(),
    });
  });
  return out;
}

async function loadFaqs() {
  try {
    const d = await api('/console/autoreply/faq');
    arState.faqs = d.faqs || [];
  } catch (e) {
    arState.faqs = [];
  }
  if (arState.tab === 'faq') {
    renderSettingsBody(faqTabHtml());
    refreshDeepseekPill();
  }
}

async function saveAllFaqs() {
  const items = collectFaqs();
  let ok = 0, bad = 0;
  for (const it of items) {
    if (!it.question || !it.answer) { bad++; continue; }
    const res = await apiJson('/console/autoreply/faq/update', it);
    if (res.data.ok) ok++; else bad++;
  }
  alert('已儲存 ' + ok + ' 組' + (bad ? '，' + bad + ' 組有問題（問題與答案不可為空）' : ''));
  await loadFaqs();
}

async function addFaq() {
  const res = await apiJson('/console/autoreply/faq', {
    question: '（請填寫問題）', answer: '（請填寫答案）', keywords: '', enabled: false,
  });
  if (res.data.error) { alert('新增失敗：' + res.data.error); return; }
  await loadFaqs();
}

async function deleteFaq(id) {
  if (!confirm('確定刪除這組 FAQ？')) return;
  const res = await apiJson('/console/autoreply/faq/delete', { ids: [id] });
  if (res.data.error) { alert('刪除失敗：' + res.data.error); return; }
  await loadFaqs();
}

async function importFaq(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const mode = document.getElementById('faqImportMode').value;
  const note = document.getElementById('faqImportNote');
  const fd = new FormData();
  fd.append('mode', mode);
  fd.append('file', file);
  note.innerHTML = '<div class="test-result">匯入中…</div>';
  try {
    const r = await fetch('/console/autoreply/faq/import', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.error) { note.innerHTML = '<div class="test-result">❌ ' + esc(d.error) + '</div>'; return; }
    note.innerHTML = '<div class="test-result">✅ 已寫入 ' + d.written + ' 組，目前共 ' + d.total + ' 組。</div>';
    await loadFaqs();
    await loadAutoSettings();
  } catch (e) {
    note.innerHTML = '<div class="test-result">❌ ' + esc(e.message) + '</div>';
  }
}

    '<button class="btn sm" onclick="updateTable(' + t.id + ',{enabled:' + (!t.enabled) + '})">' +
      (t.enabled ? '停用' : '啟用') + '</button>' +
    '<button class="btn sm" onclick="toggleTableRows(' + t.id + ')">' + (open ? '收起' : '展開資料列（' + t.row_count + '）') + '</button>' +
    '<button class="btn sm" onclick="location.href=\'/console/autoreply/table/export?table_id=' + t.id + '\'">匯出</button>' +
    '<label class="btn sm" style="cursor:pointer">匯入' +
      '<input type="file" accept=".xlsx,.xlsm,.csv" style="display:none" onchange="importTable(this,' + t.id + ')"></label>' +
    '<button class="btn sm danger" onclick="deleteTable(' + t.id + ')">刪除表</button>' +
    '</div>' +
    '<div class="hint">欄位：' + (cols.length ? esc(cols.join('、')) : '（未設定，匯入檔案時自動建立）') + '</div>';

  let bodyHtml = '';
  if (open) {
    const th = cols.map(c => '<th>' + esc(c) + '</th>').join('');
    const trs = rows.length
      ? rows.map(r => '<tr>' +
          cols.map(c => '<td><input type="text" value="' + esc((r.data || {})[c] || '') +
            '" onchange="updateRow(' + r.id + ',' + t.id + ',' + JSON.stringify(c) + ',this.value)"></td>').join('') +
          '<td style="text-align:center"><button class="btn sm danger" onclick="deleteRow(' + r.id + ',' + t.id + ')">刪</button></td>' +
        '</tr>').join('')
      : '<tr><td colspan="' + (cols.length + 1) + '"><div class="empty-note">尚無資料列</div></td></tr>';

    bodyHtml = '<div class="tbl-wrap"><table class="data-table"><thead><tr>' + th +
      '<th style="width:52px">操作</th></tr></thead><tbody>' + trs + '</tbody></table></div>' +
      '<div class="row" style="margin-top:8px">' +
        '<button class="btn sm" onclick="addRow(' + t.id + ')">＋ 新增一列</button>' +
        '<button class="btn sm" onclick="editColumns(' + t.id + ')">編輯欄位</button>' +
      '</div>';
  }

  return '<div class="card">' + head + bodyHtml + '</div>';
}

async function loadTables(keepOpen) {
  try {
    const d = await api('/console/autoreply/table?rows=1');
    arState.tables = d.tables || [];
  } catch (e) {
    arState.tables = [];
  }
  if (!keepOpen) arState.openTableId = arState.openTableId;
  if (arState.tab === 'table') {
    renderSettingsBody(tableTabHtml());
    refreshDeepseekPill();
  }
}

function toggleTableRows(id) {
  arState.openTableId = arState.openTableId === id ? null : id;
  renderSettingsBody(tableTabHtml());
}

async function createTable() {
  const name = prompt('新表格名稱：', '業務表格');
  if (!name) return;
  const res = await apiJson('/console/autoreply/table/create', { name: name, columns: [] });
  if (res.data.error) { alert('新增失敗：' + res.data.error); return; }
  await loadTables();
  await loadAutoSettings();
}

async function updateTable(id, fields) {
  const res = await apiJson('/console/autoreply/table/update', Object.assign({ id: id }, fields));
  if (res.data.error) { alert('更新失敗：' + res.data.error); return; }
  await loadTables();
  await loadAutoSettings();
}

async function deleteTable(id) {
  if (!confirm('確定刪除這張表？底下的資料列會一併刪除。')) return;
  const res = await apiJson('/console/autoreply/table/delete', { id: id });
  if (res.data.error) { alert('刪除失敗：' + res.data.error); return; }
  if (arState.openTableId === id) arState.openTableId = null;
  await loadTables();
  await loadAutoSettings();
}

async function addRow(tableId) {
  const t = arState.tables.find(x => x.id === tableId);
  if (!t) return;
  if (!(t.columns || []).length) { alert('請先編輯欄位（設定欄位名稱）'); return; }
  const data = {};
  (t.columns || []).forEach(c => { data[c] = ''; });
  const res = await apiJson('/console/autoreply/table/row', { action: 'create', table_id: tableId, data: data });
  if (res.data.error) { alert('新增失敗：' + res.data.error); return; }
  await loadTables();
}

async function updateRow(rowId, tableId, column, value) {
  const t = arState.tables.find(x => x.id === tableId);
  const row = t && (t.rows || []).find(r => r.id === rowId);
  const data = Object.assign({}, (row && row.data) || {});
  data[column] = value;
  const res = await apiJson('/console/autoreply/table/row', { action: 'update', id: rowId, data: data });
  if (res.data.error) alert('更新失敗：' + res.data.error);
}

async function deleteRow(rowId, tableId) {
  const res = await apiJson('/console/autoreply/table/row', { action: 'delete', id: rowId });
  if (res.data.error) { alert('刪除失敗：' + res.data.error); return; }
  await loadTables();
  await loadAutoSettings();
}

async function editColumns(tableId) {
  const t = arState.tables.find(x => x.id === tableId);
  if (!t) return;
  const cur = (t.columns || []).join(', ');
  const input = prompt('欄位名稱（用逗號分隔）：', cur);
  if (input === null) return;
  const cols = input.split(',').map(s => s.trim()).filter(Boolean);
  const res = await apiJson('/console/autoreply/table/update', { id: tableId, columns: cols });
  if (res.data.error) { alert('更新失敗：' + res.data.error); return; }
  await loadTables();
}

async function importTable(input, tableId) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const note = document.getElementById('tableImportNote');
  let mode = 'replace';
  if (tableId) {
    mode = confirm('要「附加」到現有資料列嗎？\n\n確定 = 附加（保留原有資料）\n取消 = 覆寫（清空後匯入）')
      ? 'append' : 'replace';
  }
  const fd = new FormData();
  fd.append('table_id', String(tableId || 0));
  fd.append('name', file.name.replace(/\.[^.]+$/, ''));
  fd.append('mode', mode);
  fd.append('file', file);
  if (note) note.innerHTML = '<div class="test-result">匯入中…</div>';
  try {
    const r = await fetch('/console/autoreply/table/import', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.error) {
      if (note) note.innerHTML = '<div class="test-result">❌ ' + esc(d.error) + '</div>';
      return;
    }
    if (note) {
      note.innerHTML = '<div class="test-result">✅ 已寫入 ' + d.written + ' 列，欄位：' +
        esc((d.columns || []).join('、')) + '</div>';
    }
    arState.openTableId = d.table_id;
    await loadTables();
    await loadAutoSettings();
  } catch (e) {
    if (note) note.innerHTML = '<div class="test-result">❌ ' + esc(e.message) + '</div>';
  }
}

/* ----- 分頁四：紀錄 ----- */

function logsTabHtml() {
  const s = arState.settings;
  const opts = s ? s.scopes.map(sc =>
    '<option value="' + sc.channel + '|' + sc.scope + '">' + esc(sc.label) + '</option>').join('') : '';
  const items = arState.logs.length
    ? arState.logs.map(logItemHtml).join('')
    : '<div class="empty-note">尚無自動回復紀錄</div>';

  return '' +
    '<div class="card">' +
      '<h3>自動回復紀錄</h3>' +
      '<div class="hint">每次自動回復的處置都會留痕：命中哪一層、未命中的原因、送出結果。</div>' +
      '<div class="row">' +
        '<select id="logChannel" style="padding:7px 10px;border:1px solid var(--border);border-radius:9px">' +
          '<option value="">全部渠道</option>' + opts + '</select>' +
        '<select id="logTier" style="padding:7px 10px;border:1px solid var(--border);border-radius:9px">' +
          '<option value="">全部結果</option>' +
          '<option value="faq">FAQ 命中</option>' +
          '<option value="table">表格命中</option>' +
          '<option value="miss">未命中</option>' +
        '</select>' +
        '<button class="btn primary" onclick="loadLogs()">查詢</button>' +
        '<span id="logTotal" class="hint" style="margin:0"></span>' +
      '</div>' +
    '</div>' +
    '<div id="logList">' + items + '</div>';
}

function logItemHtml(r) {
  const tierTag = r.tier === 'faq'
    ? '<span class="tag-auto-faq">自動回復-FAQ命中</span>'
    : (r.tier === 'table'
      ? '<span class="tag-auto-table' + (r.rewrote ? ' rw' : '') + '">自動回復-表格命中' +
        (r.rewrote ? '·改寫' : '') + '</span>'
      : '<span class="tag-auto-miss">自動回復未命中</span>');
  const sendTag = r.send_status === 'sent'
    ? '<span class="pill on">已送出</span>'
    : (r.send_status === 'failed' ? '<span class="pill miss">送出失敗</span>'
      : '<span class="pill off">未送出</span>');
  const label = AR_CHANNEL_LABEL[r.channel] || r.channel;
  return '<div class="log-item">' +
    '<div class="lg-head">' + tierTag + sendTag +
      '<b>' + esc(label) + ' ' + (r.reply_scope === 'dm' ? '私訊' : '貼文留言') + '</b>' +
      '<span class="lg-time">' + fmtTime(r.created_at) + '</span>' +
    '</div>' +
    (r.question ? '<div class="lg-q">客戶：' + esc(r.question) + '</div>' : '') +
    (r.rewritten_query && r.rewritten_query !== r.question
      ? '<div class="lg-q">改寫問句：' + esc(r.rewritten_query) +
        (r.history_used ? '（帶入 ' + r.history_used + ' 則對話）' : '') + '</div>' : '') +
    (r.answer ? '<div>回覆：' + esc(r.answer) + '</div>' : '') +
    (r.detail ? '<div class="lg-q">' + esc(r.detail) + '</div>' : '') +
    (r.reason && r.reason !== 'sent' ? '<div class="lg-q">原因：' + esc(r.reason) + '</div>' : '') +
  '</div>';
}

async function loadLogs() {
  const box = document.getElementById('logList');
  const sel = document.getElementById('logChannel');
  const tier = document.getElementById('logTier');
  const parts = (sel && sel.value) ? sel.value.split('|') : ['', ''];
  const qs = new URLSearchParams();
  if (parts[0]) qs.set('channel', parts[0]);
  if (parts[1]) qs.set('scope', parts[1]);
  if (tier && tier.value) qs.set('tier', tier.value);
  qs.set('limit', '100');
  if (box) box.innerHTML = '<div class="empty-note">載入中…</div>';
  try {
    const d = await api('/console/autoreply/logs?' + qs.toString());
    arState.logs = d.logs || [];
    if (box) box.innerHTML = arState.logs.length
      ? arState.logs.map(logItemHtml).join('')
      : '<div class="empty-note">沒有符合條件的紀錄</div>';
    const tot = document.getElementById('logTotal');
    if (tot) tot.textContent = '共 ' + d.total + ' 筆';
  } catch (e) {
    if (box) box.innerHTML = '<div class="empty-note">載入失敗：' + esc(e.message) + '</div>';
  }
}

/* ==================================================================
   啟動
   ⚠ 一律留在檔案最後：前面所有 const / function 都已初始化完畢，
     不會踩到 const 的暫時性死區（TDZ）。之前把啟動寫在中段，
     導致 renderList() → renderAutoBar() 讀到尚未初始化的 arState，
     整段啟動中斷，自動回復開關列就永遠停在「載入中…」。
   ================================================================== */

function boot() {
  try {
    renderTabs();
    renderList();
    loadConversations();
    loadPendingComments();
    loadAutoSettings();
    syncFullOnce();                  // 開頁面全量掃一次（貼文清單 + 所有留言 + 私訊名稱）
    setInterval(poll, 3000);               // 每 3 秒從 DB 重讀畫面（不打 Meta）
    setInterval(syncLight, 10000);         // 每 10 秒拉新貼文 + 當前貼文留言
    setInterval(syncNames, 60000);         // 每 60 秒補私訊名稱
    setInterval(loadAutoSettings, 30000);  // 開關狀態同步（別的頁面改了也跟得上）
  } catch (e) {
    // 啟動任何一步失敗都不要讓整個工作台跟著死掉
    console.error('工作台啟動失敗', e);
    const btn = document.getElementById('arBtn');
    if (btn) {
      btn.textContent = '啟動失敗';
      btn.title = '工作台啟動時發生錯誤，請看瀏覽器 Console：' + e.message;
      btn.classList.remove('on');
      btn.classList.add('off');
    }
  }
}

boot();
