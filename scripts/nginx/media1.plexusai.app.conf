# ============================================================
#  media1.plexusai.app  →  connector (127.0.0.1:8010)
#
#  部署位置：/etc/nginx/sites-available/media1.plexusai.app
#            （sites-enabled 已有 symlink，不需要重建）
#
#  這個檔案是「整份取代」，但保留了原本 Certbot 產生的 ssl 設定行。
#  改動只有一個地方：location / 從「靜態 root」改成「反向代理 + 白名單」。
#
#  動手前必做：
#      sudo cp /etc/nginx/sites-available/media1.plexusai.app{,.bak.$(date +%F)}
#      # 寫入後
#      sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠️ 絕對不要碰 default 與 voice.plexusai.app（別人的活躍服務）
# ============================================================

server {
    if ($host = media1.plexusai.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name media1.plexusai.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media1.plexusai.app;

    ssl_certificate /etc/letsencrypt/live/media1.plexusai.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/media1.plexusai.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # RAG 上傳上限 50MB（RAG_MAX_UPLOAD_MB），nginx 預設 1MB 會直接 413
    client_max_body_size 64m;

    # ---- 內網 API 一律封死（只靠 token 不夠，8010 對公網等於全裸露）----
    location /internal/ {
        return 403;
    }

    # ---- webhook：微信 + Meta 全部走這幾條（connector/app/webhook.py）----
    #   /wechat              GET 驗證 + POST 收訊
    #   /wechat/{native_id}  POST 多帳號
    #   /webhook             Meta（IG / FB / WhatsApp 共用同一支 handler）
    #   /whatsapp/webhook    同上，等價路由
    #   /webhook/{native_id} POST 多帳號
    location ~ ^/(wechat|webhook|whatsapp/webhook)(/|$) {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Meta 重送要求快速回應；connector 內部是「先入庫再回 200」，不需要長 timeout
    }

    # ---- 媒體：Meta 會自己來抓圖（PUBLIC_BASE_URL + /files/<media_key>）----
    #      也是 crm 的 /files/{name} 代理端點的上游
    location /files/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- 健康檢查（給 uptime 監控用）----
    location = /health {
        proxy_pass http://127.0.0.1:8010;
        access_log off;
    }

    # ---- 其餘一律不認（這個域只服務 webhook 與媒體）----
    location / {
        return 404;
    }
}
