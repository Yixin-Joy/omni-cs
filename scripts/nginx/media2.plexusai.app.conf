# ============================================================
#  media2.plexusai.app  →  crm (127.0.0.1:8020)
#
#  部署位置：/etc/nginx/sites-available/media2.plexusai.app
#            （sites-enabled 已有 symlink，不需要重建）
#
#  這個域是「整個工作台」：登入頁、客服端、管理員端、運維頁、知識庫、
#  以及知識庫圖片的公開目錄 /media/。所以 location / 全部轉給 8020。
#
#  動手前必做：
#      sudo cp /etc/nginx/sites-available/media2.plexusai.app{,.bak.$(date +%F)}
#      # 寫入後
#      sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    if ($host = media2.plexusai.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name media2.plexusai.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media2.plexusai.app;

    # ★ 實測確認（2026-10-22）：media2 與 media1 **共用同一張證**（SAN 涵蓋兩域），
    #   原檔就是指向 media1.plexusai.app 的 lineage，照抄不要改。
    ssl_certificate /etc/letsencrypt/live/media1.plexusai.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/media1.plexusai.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 知識庫上傳上限 50MB（RAG_MAX_UPLOAD_MB），預設 1MB 會 413
    client_max_body_size 64m;

    # ---- 內網 API 一律封死 ----
    location /internal/ {
        return 403;
    }

    # ---- 工作台本體 ----
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 同步呼叫有 25~30s（DEEPSEEK_AUX_TIMEOUT=25），留足餘裕
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8020;
        access_log off;
    }
}
